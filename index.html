<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión - Milanesas y Pastas</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  body{background:#fdf0f5;padding-bottom:70px}
  header{background:#f8bbd0;padding:10px 12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,.15)}
  header h1{font-size:18px;color:#880e4f}
  .sync{font-size:11.5px;color:#880e4f;margin-top:3px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .kpis div{background:#fff;border-radius:8px;padding:5px 10px;color:#880e4f;font-weight:bold;font-size:13px}
  nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #f8bbd0;z-index:10}
  nav button{flex:1;padding:11px 0;border:none;background:none;font-size:11.5px;color:#888;cursor:pointer}
  nav button.activo{color:#2e7d32;font-weight:bold;background:#f1f8e9}
  main{padding:12px}
  .buscador{width:100%;padding:10px;border:1px solid #f48fb1;border-radius:8px;margin-bottom:10px;font-size:15px}
  .card{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .card .nombre{font-weight:bold;color:#4a148c;font-size:15px}
  .card .unidad{font-size:12px;color:#888}
  .fila{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .stock-btn{width:34px;height:34px;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;color:#fff}
  .mas{background:#66bb6a}.menos{background:#ef5350}
  .stock-num{font-size:17px;font-weight:bold;min-width:36px;text-align:center}
  .sin-stock{color:#c62828;font-weight:bold}
  input.precio{width:88px;padding:6px;border:1px solid #ccc;border-radius:6px;font-size:14px;text-align:right}
  input, select{font-size:15px;padding:8px;border:1px solid #ccc;border-radius:8px}
  .etiq{font-size:12px;color:#555}
  .gana{font-size:13px;color:#2e7d32;font-weight:bold}
  .btn{background:#
